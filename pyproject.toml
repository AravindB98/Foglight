[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foglight"
version = "0.1.0"
description = "All-seeing internet intelligence layer for agents and humans"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Aravind Balaji" }]
keywords = ["ai", "agents", "intelligence", "memory", "monitoring", "mcp"]
dependencies = []  # core is stdlib-only

[project.optional-dependencies]
rss = ["feedparser>=6.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
llm = ["anthropic>=0.40"]
mcp = ["mcp>=1.2"]
memory = ["chromadb>=0.5"]
supermemory = ["supermemory>=3.0"]
files = ["pypdf>=4.0"]
dev = ["pytest>=8.0"]
all = ["feedparser>=6.0", "fastapi>=0.110", "uvicorn>=0.29", "anthropic>=0.40", "mcp>=1.2", "chromadb>=0.5", "supermemory>=3.0", "pypdf>=4.0"]

[project.scripts]
foglight = "foglight.cli:main"

[tool.setuptools.packages.find]
include = ["foglight*"]
